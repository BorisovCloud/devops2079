apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: podinfo
  namespace: argo-cd
spec:
  destination:
    namespace: podinfo
    server: https://kubernetes.default.svc
  project: default
  sources:
  - repoURL: https://github.com/BorisovCloud/hellogo-app-demo.git
    targetRevision: HEAD
    ref: values
  - chart: podinfo
    repoURL: https://stefanprodan.github.io/podinfo
    targetRevision: 6.17.0
    helm:
      valueFiles:
        - $values/podinfo/podinfo-values.yaml
  syncPolicy:
    automated:
      enabled: true
      prune: false
      selfHeal: false
